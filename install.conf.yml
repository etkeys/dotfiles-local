- defaults:
    link:
        create: true
        force: true
        relink: true 
    shell:
        stderr: true
        stdout: true

- create:
  - ~/Libation
  - ~/repos

- sudo:
  - shell:
    -
      description: Add repo for quickemu
      command: yes | apt-add-repository ppa:flexiondotorg/quickemu
    -
      description: Perform apt cache update
      command: apt-get update
    # -
    #   description: Update alternatives
    #   command: >
    #     declare -A alts &&
    #     alts[editor]="$(command -v vim.basic)" &&
    #     (for key in "${!alts[@]}"; do
    #       update-alternatives --set $key "${alts[$key]}"
    #     done)

- link:
    ~/:
      path: home/.*
      glob: true
      exclude:
          - home/.gitignore
    ~/.config/autostart: config/autostart
    ~/.config/Code: config/Code
    ~/.config/ghb/preferences.json: config/ghb/preferences.json
    ~/.config/gbh/presets.json: config/ghb/presets.json
    ~/.config/redshift.conf: config/redshift.conf
    ~/.config/monitors.aranar.sh: config/monitors.aranar.sh
    ~/.config/plasma-org.kde.plasma.desktop-appletsrc: config/plasma-org.kde.plasma.desktop-appletsrc
    ~/.local/share/konsole: kde/konsole
    ~/Libation/Settings.json: Libation/Settings.json

